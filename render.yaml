services:
  - type: web
    name: dipromes
    env: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --chdir backend app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dipromes-db
          property: connectionString

databases:
  - name: dipromes-db
    plan: free
    databaseName: dipromes
    user: dipromes
