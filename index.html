<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DIPROMES</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#1B6B2E;--brand-l:#144F22;--brand-dim:rgba(27,107,46,0.08);--brand-dim2:rgba(27,107,46,0.15);
  --bg:#ffffff;--bg2:#f4f6f8;--bg3:#e8ecf0;
  --text:#1c2028;--text2:#4a5568;--text3:#9aa5b4;
  --border:rgba(0,0,0,0.1);--border2:rgba(0,0,0,0.18);
  --r:6px;--rl:8px;
  --ok:#1a9b6c;--ok-bg:#e6f5ef;--ok-t:#0d6644;
  --warn:#d4860a;--warn-bg:#fef3dc;--warn-t:#7a4e00;
  --danger:#d63c3c;--danger-bg:#fdeaea;--danger-t:#9b1c1c;
  --info:#2563EB;--info-bg:#EFF6FF;--info-t:#1d4ed8;
}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg3);color:var(--text);font-size:14px;line-height:1.5}

/* ── LAYOUT ── */
.app{display:flex;height:100vh;overflow:hidden}
.sidebar{width:220px;background:var(--bg);border-right:0.5px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;transition:width .2s}
.sidebar.collapsed{width:56px}
.sidebar-logo{padding:16px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;gap:10px;min-height:56px}
.logo-mark{width:28px;height:28px;background:var(--brand);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#fff;font-weight:700;font-size:13px}
.logo-text{overflow:hidden}
.logo-name{font-size:14px;font-weight:600;color:var(--brand);white-space:nowrap}
.logo-sub{font-size:10px;color:var(--text3);white-space:nowrap}
.nav{flex:1;padding:8px 0;overflow-y:auto}
.nav-section{font-size:10px;font-weight:600;color:var(--text3);padding:10px 16px 3px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden}
.sidebar.collapsed .nav-section{opacity:0}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;color:var(--text2);font-size:13px;border-left:2.5px solid transparent;transition:all .15s;white-space:nowrap;overflow:hidden}
.nav-item:hover{background:var(--bg2);color:var(--text)}
.nav-item.active{background:var(--brand-dim);color:var(--brand);border-left-color:var(--brand);font-weight:600}
.nav-item i{font-size:17px;flex-shrink:0}
.sidebar.collapsed .nav-item{padding:10px;justify-content:center}
.sidebar.collapsed .nav-item span{display:none}
.sidebar.collapsed .nav-section{padding:8px}
.nav-footer{padding:12px 16px;border-top:0.5px solid var(--border);font-size:11px;color:var(--text3)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:52px;background:var(--bg);border-bottom:0.5px solid var(--border);display:flex;align-items:center;padding:0 20px;gap:10px;flex-shrink:0}
.topbar-toggle{background:none;border:none;cursor:pointer;color:var(--text2);font-size:20px;padding:4px;border-radius:6px}
.topbar-toggle:hover{background:var(--bg2)}
.topbar-title{font-size:15px;font-weight:600;flex:1}
.content{flex:1;overflow-y:auto;padding:20px}

/* ── BOTONES ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--r);border:0.5px solid var(--border2);background:transparent;color:var(--text);cursor:pointer;font-size:13px;font-family:inherit;transition:background .15s;white-space:nowrap}
.btn:hover{background:var(--bg2)}
.btn-primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.btn-primary:hover{background:var(--brand-l)}
.btn-sm{padding:5px 10px;font-size:12px}
.btn-ghost{border-color:transparent}.btn-ghost:hover{border-color:var(--border)}
.btn-ok{background:var(--ok-bg);color:var(--ok-t);border-color:transparent}
.btn-danger{background:var(--danger-bg);color:var(--danger-t);border-color:transparent}

/* ── CARDS / MÉTRICAS ── */
.card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:16px 20px;margin-bottom:16px}
.card-title{font-size:11px;font-weight:700;color:var(--text2);margin-bottom:12px;text-transform:uppercase;letter-spacing:.05em}
.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.metric{background:var(--bg2);border-radius:var(--r);padding:14px 16px}
.metric-label{font-size:11px;color:var(--text2);margin-bottom:5px}
.metric-val{font-size:24px;font-weight:700}
.metric-val.ok{color:var(--ok)}.metric-val.warn{color:var(--warn)}.metric-val.danger{color:var(--danger)}
.metric-sub{font-size:11px;color:var(--text3);margin-top:3px}

/* ── TABLA ── */
.tbl-wrap{overflow:hidden;border-radius:var(--rl);border:0.5px solid var(--border)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:700;color:var(--text2);text-align:left;padding:9px 13px;border-bottom:0.5px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.04em;background:var(--bg2);white-space:nowrap}
.tbl td{padding:10px 13px;border-bottom:0.5px solid var(--border);vertical-align:middle}
.tbl tbody tr:last-child td{border-bottom:none}
.tbl tbody tr{transition:background .1s;cursor:pointer}
.tbl tbody tr:hover{background:var(--bg2)}

/* ── BADGES ── */
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:100px;font-size:11px;font-weight:600;white-space:nowrap}
.badge-ok{background:var(--ok-bg);color:var(--ok-t)}
.badge-warn{background:var(--warn-bg);color:var(--warn-t)}
.badge-danger{background:var(--danger-bg);color:var(--danger-t)}
.badge-info{background:var(--info-bg);color:var(--info-t)}
.badge-gray{background:var(--bg2);color:var(--text2)}
.badge-brand{background:var(--brand-dim2);color:var(--brand)}

/* ── MODALES ── */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--bg);border-radius:var(--rl);border:0.5px solid var(--border);padding:24px;width:620px;max-width:100%;max-height:90vh;overflow-y:auto;position:relative}
.modal-lg{width:760px}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px}
.modal-close{position:absolute;top:14px;right:16px;background:none;border:none;cursor:pointer;color:var(--text3);font-size:22px;line-height:1;font-family:inherit;padding:2px 6px;border-radius:4px}
.modal-close:hover{background:var(--bg2);color:var(--text)}

/* ── FORMULARIOS ── */
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:4px}
.form-grid.cols3{grid-template-columns:1fr 1fr 1fr}
.form-group{margin-bottom:12px}
.form-group.span2{grid-column:span 2}
.form-group label{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.form-group input,.form-group select,.form-group textarea{width:100%;border:0.5px solid var(--border2);border-radius:var(--r);padding:8px 10px;font-size:13px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;transition:border .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--brand)}
.form-group textarea{resize:vertical;min-height:65px}
.section-divider{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;padding:10px 0 6px;border-bottom:0.5px solid var(--border);margin-bottom:10px;grid-column:span 2}

/* ── TABS ── */
.tabs{display:flex;border-bottom:0.5px solid var(--border);margin-bottom:16px;gap:2px}
.tab{padding:9px 16px;cursor:pointer;font-size:13px;color:var(--text2);border-bottom:2px solid transparent;transition:color .15s}
.tab:hover{color:var(--text)}
.tab.active{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}

/* ── MISC ── */
.progress{height:6px;background:var(--bg2);border-radius:3px;overflow:hidden}
.progress-bar{height:100%;border-radius:3px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.dot-ok{background:var(--ok)}.dot-warn{background:var(--warn)}.dot-danger{background:var(--danger)}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;background:var(--brand-dim);color:var(--brand)}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:0.5px solid var(--border);font-size:13px}
.info-row:last-child{border-bottom:none}
.info-label{color:var(--text2);flex-shrink:0;margin-right:12px}
.info-val{font-weight:500;text-align:right}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-state i{font-size:36px;display:block;margin-bottom:10px;color:var(--border2)}
.conn-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;color:var(--brand);background:var(--brand-dim);padding:2px 8px;border-radius:100px;font-weight:600}
.search-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 16px;border-bottom:0.5px solid var(--border)}
.search-bar input,.search-bar select{border:0.5px solid var(--border2);border-radius:var(--r);padding:7px 10px;font-size:13px;background:var(--bg);color:var(--text);outline:none;font-family:inherit}
.search-bar input{flex:1;min-width:160px}
.maq-card{background:var(--bg2);border-radius:var(--r);padding:12px 14px;border:0.5px solid var(--border);cursor:pointer;transition:all .15s;position:relative}
.maq-card:hover{border-color:var(--brand);background:var(--brand-dim)}
.maq-card.activa{border-color:var(--ok);background:var(--ok-bg)}
.maq-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}

/* ── PRODUCTOS ── */
.prod-row{display:grid;grid-template-columns:1fr 70px 100px 32px;gap:6px;align-items:center;margin-bottom:6px}
.prod-row input{border:0.5px solid var(--border2);border-radius:var(--r);padding:6px 8px;font-size:12px;font-family:inherit;background:var(--bg);color:var(--text);outline:none}
.prod-row input:focus{border-color:var(--brand)}
.prod-total{font-size:12px;font-weight:700;color:var(--brand);padding:6px 0;text-align:right}

/* ── GALERÍA FOTOS ── */
.foto-thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.foto-thumb{width:72px;height:72px;object-fit:cover;border-radius:var(--r);border:0.5px solid var(--border);cursor:pointer;transition:opacity .15s}
.foto-thumb:hover{opacity:.8}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;z-index:500;cursor:pointer}
.lightbox img{max-width:90vw;max-height:90vh;border-radius:var(--rl)}

/* ── LOGIN ── */
.login-screen{position:fixed;inset:0;background:var(--bg3);display:flex;align-items:center;justify-content:center;z-index:1000}
.login-card{background:var(--bg);border:0.5px solid var(--border);border-radius:var(--rl);padding:40px 36px;width:340px;text-align:center;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.login-logo{width:52px;height:52px;background:var(--brand);border-radius:12px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#fff;font-size:20px;font-weight:700}

/* ── PRINT ── */
@media print{
  .app,.sidebar,.topbar{display:none!important}
  #print-area{display:block!important}
  body{background:#fff;color:#000}
}
#print-area{display:none}
.print-header{display:flex;align-items:center;gap:16px;border-bottom:2px solid #1B6B2E;padding-bottom:12px;margin-bottom:20px}
.print-logo{width:48px;height:48px;background:#1B6B2E;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px}
.print-title{font-size:20px;font-weight:700;color:#7B1A1A}
.print-sub{font-size:11px;color:#666}
.print-section{margin-bottom:16px}
.print-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:#666;border-bottom:1px solid #ddd;padding-bottom:4px;margin-bottom:8px}
.print-row{display:flex;justify-content:space-between;font-size:12px;padding:3px 0;border-bottom:1px dotted #eee}
.print-row:last-child{border-bottom:none}
.print-prod-table{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.print-prod-table th{text-align:left;padding:4px 8px;background:#f5f5f5;border:1px solid #ddd}
.print-prod-table td{padding:4px 8px;border:1px solid #ddd}
.print-firmas{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:40px}
.print-firma{text-align:center}
.print-firma-line{border-bottom:1px solid #000;margin-bottom:6px;height:40px}
.print-firma-label{font-size:11px;color:#666}
</style>
</head>
<body>
<div class="app" style="display:none">

<!-- ══ SIDEBAR ══ -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div class="logo-mark"><i class="ti ti-medical-cross" style="font-size:15px"></i></div>
    <div class="logo-text">
      <div class="logo-name">DIPROMES</div>
      <div class="logo-sub">Dist. Prod. Médicos</div>
    </div>
  </div>
  <div class="nav">
    <div class="nav-section">Principal</div>
    <div class="nav-item active" onclick="go('dashboard')" id="nav-dashboard"><i class="ti ti-layout-dashboard"></i><span>Dashboard</span></div>
    <div class="nav-section">Pacientes</div>
    <div class="nav-item" onclick="go('pacientes')" id="nav-pacientes"><i class="ti ti-users"></i><span>Pacientes</span></div>
    <div class="nav-item" onclick="go('colocaciones')" id="nav-colocaciones"><i class="ti ti-stack-2"></i><span>Colocaciones</span></div>
    <div class="nav-item" onclick="go('mapa')" id="nav-mapa"><i class="ti ti-map-pin"></i><span>Mapa GPS</span></div>
    <div class="nav-item" onclick="go('registro')" id="nav-registro"><i class="ti ti-clipboard-list"></i><span>Registro completo</span></div>
    <div class="nav-section">Inventario</div>
    <div class="nav-item" onclick="go('maquinas')" id="nav-maquinas"><i class="ti ti-device-laptop-medical"></i><span>Máquinas</span></div>
    <div class="nav-section">Conduces</div>
    <div class="nav-item" onclick="go('facturacion')" id="nav-facturacion"><i class="ti ti-receipt"></i><span>Condu. Descargo</span></div>
    <div class="nav-section admin-only" style="display:none">Administración</div>
    <div class="nav-item admin-only" onclick="go('usuarios')" id="nav-usuarios" style="display:none"><i class="ti ti-users-group"></i><span>Usuarios</span></div>
  </div>
  <div class="nav-footer" id="nav-footer-text" style="padding:10px 16px">
    <div style="font-size:11px;color:var(--text3);margin-bottom:6px">v1.0 · DIPROMES</div>
    <button class="btn btn-sm btn-ghost" style="justify-content:flex-start;font-size:11px;padding:4px 8px;width:100%" onclick="abrirGestionDB()">
      <i class="ti ti-database-cog" style="font-size:13px"></i><span>Gestión de base de datos</span>
    </button>
  </div>
</div>

<!-- ══ MAIN ══ -->
<div class="main">
  <div class="topbar">
    <button class="topbar-toggle" onclick="toggleSidebar()" title="Menú"><i class="ti ti-menu-2"></i></button>
    <div class="topbar-title" id="view-title">Dashboard</div>
    <button class="btn btn-sm btn-ghost" onclick="abrirImportarExcel()" id="btn-import" style="display:none"><i class="ti ti-upload"></i>Importar Excel</button>
    <button class="btn btn-primary btn-sm" id="btn-nuevo" onclick="handleNuevo()"><i class="ti ti-plus"></i><span id="btn-nuevo-label">Nuevo</span></button>
  </div>
  <div class="content" id="content"></div>
</div>
</div>
<div id="modal-root"></div>
<div id="print-area" style="display:none"></div>

<!-- ══ LOGIN SCREEN ══ -->
<div id="login-screen" class="login-screen" style="display:none">
  <div class="login-card">
    <div class="login-logo"><i class="ti ti-medical-cross" style="font-size:22px"></i></div>
    <div style="font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px">DIPROMES</div>
    <div style="font-size:12px;color:var(--text3);margin-bottom:24px">Distribuidora de Productos Médicos y Servicios</div>
    <div class="form-group" style="text-align:left">
      <label>Usuario</label>
      <input type="text" id="login-user" placeholder="usuario" autocomplete="username" onkeydown="if(event.key==='Enter')login()">
    </div>
    <div class="form-group" style="text-align:left">
      <label>Contraseña</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')login()">
    </div>
    <div id="login-error" style="font-size:12px;color:var(--danger-t);margin-bottom:10px;display:none">Usuario o contraseña incorrectos.</div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" onclick="login()"><i class="ti ti-login"></i>Entrar</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════════════════════
// API — REST client
// ══════════════════════════════════════════════════════════════════════════════
// Escape HTML to prevent XSS when injecting user data into innerHTML
const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');

function _handleUnauth(){
  sessionStorage.removeItem('meditrack_session');
  document.getElementById('login-screen').style.display='flex';
  document.querySelector('.app').style.display='none';
}

const api = {
  async get(path){ const r=await fetch('/api'+path,{credentials:'same-origin'}); if(r.status===401){_handleUnauth();throw new Error('No autorizado');} if(!r.ok) throw new Error(r.statusText); return r.json(); },
  async post(path,data){ const r=await fetch('/api'+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),credentials:'same-origin'}); if(r.status===401&&path!=='/auth/login'){_handleUnauth();throw new Error('No autorizado');} if(!r.ok) throw new Error(r.statusText); return r.json(); },
  async put(path,data){ const r=await fetch('/api'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data),credentials:'same-origin'}); if(r.status===401){_handleUnauth();throw new Error('No autorizado');} if(!r.ok) throw new Error(r.statusText); return r.json(); },
  async del(path){ const r=await fetch('/api'+path,{method:'DELETE',credentials:'same-origin'}); if(r.status===401){_handleUnauth();throw new Error('No autorizado');} if(!r.ok) throw new Error(r.statusText); return r.json(); },
};

async function initDB(){
  const [maq,reg,pm,usr,ars] = await Promise.all([
    api.get('/maquinas'),
    api.get('/registros'),
    api.get('/pacientes-master'),
    api.get('/usuarios'),
    api.get('/config/ars'),
  ]);
  DB.maquinas = maq;
  DB.registros = reg;
  DB.pacientes_master = pm;
  DB.usuarios = usr;
  DB.ars = ars || ['Privado','ARS Humano','ARS Senasa','ARS Universal','Otro'];
  // Recalculate paciente_actual (computed field from server, rebuild locally too)
  DB.maquinas.forEach(m=>m.paciente_actual=null);
  DB.registros.filter(r=>r.estatus==='Activo'&&r.maquina).forEach(r=>{
    const m=DB.maquinas.find(x=>x.id===r.maquina);
    if(m) m.paciente_actual=r.nombre;
  });
}

function abrirGestionDB(){
  const totalReg=DB.registros.length;
  const totalMaq=DB.maquinas.length;
  document.getElementById('modal-root').innerHTML=`
<div class="overlay" onclick="if(event.target===this)closeModal()">
<div class="modal" style="max-width:440px">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <div class="modal-title"><i class="ti ti-database-cog"></i> Gestión de base de datos</div>
  <div style="font-size:12px;color:var(--text-light);margin-bottom:16px">
    Base de datos actual: <strong>${totalReg} registros</strong> · <strong>${totalMaq} máquinas</strong>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">

    <div style="border:1px solid var(--border);border-radius:var(--r);padding:12px">
      <div style="font-size:13px;font-weight:600;margin-bottom:4px"><i class="ti ti-download" style="font-size:13px"></i> Exportar backup JSON</div>
      <div style="font-size:12px;color:var(--text-light);margin-bottom:8px">Descarga un archivo <code>.json</code> con todos los registros, máquinas y usuarios. Úsalo para restaurar o migrar datos.</div>
      <button class="btn btn-sm btn-primary" onclick="exportarBackupJSON()"><i class="ti ti-download"></i> Descargar backup</button>
    </div>

    <div style="border:1px solid var(--border);border-radius:var(--r);padding:12px">
      <div style="font-size:13px;font-weight:600;margin-bottom:4px"><i class="ti ti-upload" style="font-size:13px"></i> Importar backup JSON</div>

function exportarBackupJSON(){
  window.location.href='/api/exportar/backup';
}

async function importarBackupJSON(){
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async e => {
    const file = e.target.files[0]; if(!file) return;
    const reader = new FileReader();
    reader.onload = async ev => {
      try{
        const data = JSON.parse(ev.target.result);
        if(!data.maquinas || !data.registros) throw new Error('Formato inválido');
        showToast('Importando...');
        closeModal();
        await api.post('/importar/backup', data);
        await initDB();
        go(VIEW);
        showToast('Backup importado correctamente');
      }catch(err){ showToast('Error al importar: '+err.message, true); }
    };
    reader.readAsText(file);
  };
  input.click();
}

async function limpiarDB(reseed){
  const msg = reseed
    ? '¿Limpiar toda la base de datos y cargar los datos de demostración?'
    : '¿Eliminar TODOS los registros y máquinas? Esta acción no se puede deshacer.';
  if(!confirm(msg)) return;
  try{
    closeModal();
    showToast(reseed ? 'Restaurando datos demo...' : 'Limpiando base de datos...');
    await api.post('/db/reset', {reseed});
    await initDB();
    go('dashboard');
    showToast(reseed ? 'Datos demo restaurados' : 'Base de datos limpiada');
  }catch(e){ showToast('Error: '+e.message, true); }
}

// Toast de confirmación
function showToast(msg, isError=false){
  let t = document.getElementById('toast');
  if(!t){
    t = document.createElement('div');
    t.id = 'toast';
    t.style.cssText = 'position:fixed;bottom:20px;right:20px;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:600;z-index:9999;transition:opacity .3s;pointer-events:none';
    document.body.appendChild(t);
  }
  t.textContent = (isError ? '✗ ' : '✓ ') + msg;
  t.style.background = isError ? 'var(--danger)' : 'var(--ok)';
  t.style.color = '#fff';
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(()=>{ t.style.opacity='0'; }, 2000);
}

function onPacChange(){

async function agregarARS(returnSelectId){
  const input=document.getElementById('ars-nueva');
  const nombre=(input?.value||'').trim();
  if(!nombre) return;
  if(DB.ars.includes(nombre)){showToast('Ya existe en la lista',true);return;}
  DB.ars.push(nombre);
  await api.put('/config/ars',DB.ars);
  input.value='';
  window._arsRenderModal?.();
  showToast('ARS agregada');
}

async function eliminarARS(idx,returnSelectId){
  const nombre=DB.ars[idx];
  if(!confirm(`¿Eliminar "${nombre}" de la lista?`)) return;
  DB.ars.splice(idx,1);
  await api.put('/config/ars',DB.ars);
  window._arsRenderModal?.();
  showToast('ARS eliminada');
}

// Pacientes únicos (deduplicados por nombre)
function getPacientesUnicos(){
  const map={};
  DB.registros.forEach(r=>{
    if(!r.nombre) return;
    if(!map[r.nombre]){
      map[r.nombre]={...r, colocaciones:[], total_facturado:0};
    }
    map[r.nombre].colocaciones.push(r);
    map[r.nombre].total_facturado+=(r.facturacion||0);
    if(r.estatus==='Activo') map[r.nombre].estatus='Activo';
    // Actualiza datos con la entrada más reciente
    if(r.fecha > map[r.nombre].fecha){
      map[r.nombre].maquina=r.maquina;
      map[r.nombre].motivo=r.motivo;
    }
  });
  // Aplicar ediciones del perfil maestro
  Object.keys(map).forEach(nombre=>{
    if(DB.pacientes_master[nombre]){
      Object.assign(map[nombre], DB.pacientes_master[nombre]);
    }
  });
  return Object.values(map);
}
function getMaquinaLabel(id){
  const m=DB.maquinas.find(x=>x.id===id);

function abrirCambiarEquipo(regId){
  const reg=DB.registros.find(r=>r.id===regId);if(!reg)return;
  const maqActual=DB.maquinas.find(m=>m.id===reg.maquina);
  const disponibles=DB.maquinas.filter(m=>!m.paciente_actual&&m.estado==='Operativa');
  document.getElementById('modal-root').innerHTML=`
<div class="overlay" onclick="if(event.target===this)closeModal()">
<div class="modal">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <div class="modal-title"><i class="ti ti-arrows-exchange" style="color:var(--brand);margin-right:6px;vertical-align:-2px"></i>${maqActual?'Cambiar equipo':'Asignar equipo'} — ${reg.nombre}</div>
  ${maqActual?`<div style="margin-bottom:12px;padding:10px 12px;background:var(--warn-bg);border-radius:var(--r);font-size:12px">
    <span style="color:var(--warn-t);font-weight:600"><i class="ti ti-device-laptop-medical"></i> Equipo actual: ${maqActual.nombre}</span>
    <span style="color:var(--text2);margin-left:8px">Serial: ${maqActual.serial||'—'}</span>
  </div>`:''}
  <div style="font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px">Equipos disponibles</div>
  ${disponibles.length===0
    ?`<div class="empty-state" style="padding:16px"><i class="ti ti-circle-x" style="font-size:24px"></i><br>Todas las máquinas operativas están en uso</div>`
    :`<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:16px" id="ceq-selector">
      ${disponibles.map(m=>`
      <div class="maq-card" id="csel-${m.id}" onclick="seleccionarCEq('${m.id}')" style="cursor:pointer">
        <div style="font-size:10px;font-weight:700;color:var(--text3)">${m.id}</div>
        <div style="font-weight:700;font-size:13px">${m.nombre}</div>
        <div style="font-size:11px;color:var(--text2)">Serial: ${m.serial||'—'}</div>
        <div style="font-size:11px;color:var(--text2)">${m.ubicacion||''}</div>
      </div>`).join('')}
    </div>`}
  <input type="hidden" id="ceq-maqid" value="">
  <div style="display:flex;gap:8px;margin-top:4px">
    <button class="btn btn-primary" style="flex:1" onclick="guardarCambiarEquipo('${regId}')"><i class="ti ti-device-floppy"></i>Confirmar cambio</button>
    <button class="btn" onclick="closeModal()">Cancelar</button>
  </div>
</div>
</div>`;
}

function seleccionarCEq(id){
  document.querySelectorAll('#ceq-selector .maq-card').forEach(c=>{c.style.borderColor='';c.style.background='';});
  const card=document.getElementById('csel-'+id);
  if(card){card.style.borderColor='var(--brand)';card.style.background='var(--brand-dim)';}
  document.getElementById('ceq-maqid').value=id;
}

async function guardarCambiarEquipo(regId){
  const nuevaMaqId=document.getElementById('ceq-maqid').value;
  if(!nuevaMaqId){alert('Selecciona un equipo.');return;}
  const reg=DB.registros.find(r=>r.id===regId);if(!reg)return;
  try{
    // Liberar máquina anterior
    if(reg.maquina){
      const mOld=DB.maquinas.find(m=>m.id===reg.maquina);
      if(mOld)mOld.paciente_actual=null;
    }
    await api.put('/registros/'+regId,{maquina:nuevaMaqId});
    reg.maquina=nuevaMaqId;
    const mNew=DB.maquinas.find(m=>m.id===nuevaMaqId);
    if(mNew)mNew.paciente_actual=reg.nombre;
    showToast('Equipo actualizado');
  }catch(e){showToast('Error: '+e.message,true);return;}
  closeModal();
  renderColocaciones();
}

function initMapa(){

    attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
    maxZoom:19,

}

function actualizarMarkers(){
  if(!_mapaInst) return;
  _mapaMarkers.forEach(m=>m.remove());
  _mapaMarkers=[];
  const regs=DB.registros.filter(r=>{

  // Update filter buttons appearance
  document.querySelectorAll('#content .btn.btn-sm').forEach(b=>{
    if(b.textContent.includes('Activos')) b.className='btn btn-sm'+(_mapaFiltro==='activos'?' btn-primary':'');
    if(b.textContent.includes('Todos')) b.className='btn btn-sm'+(_mapaFiltro==='todos'?' btn-primary':'');
  });
  regs.forEach(r=>{
    const activo=r.estatus==='Activo';
    const maqNombre=DB.maquinas.find(m=>m.id===r.maquina)?.nombre||'—';
    const popup=`
      <div style="font-size:13px;min-width:180px">

let _factFiltroMes='';
let _factFiltroPac='';

function renderFacturacion(){
  // Unique months from all records with a conduce
  const meses=[...new Set(
    DB.registros.filter(r=>r.facturacion>0).map(r=>r.fecha.slice(0,7))
  )].sort().reverse();
  if(!_factFiltroMes && meses.length) _factFiltroMes=meses[0];

  // Filtered conduces
  const conduces=DB.registros.filter(r=>{
    if(r.facturacion<=0 && r.saldo_pendiente<=0) return false;
    if(_factFiltroMes && !r.fecha.startsWith(_factFiltroMes)) return false;
    if(_factFiltroPac && !r.nombre.toLowerCase().includes(_factFiltroPac.toLowerCase())) return false;
    return true;
  }).sort((a,b)=>b.fecha.localeCompare(a.fecha));

  // Metrics (always over entire dataset, not just filtered)
  const allConduces=DB.registros.filter(r=>r.facturacion>0);
  const totalFact=allConduces.reduce((s,r)=>s+(r.facturacion||0),0);
  const totalSaldo=DB.registros.reduce((s,r)=>s+(r.saldo_pendiente||0),0);
  const totalCobrado=totalFact-totalSaldo;
  const pacConSaldo=[...new Set(DB.registros.filter(r=>r.saldo_pendiente>0).map(r=>r.nombre))];

  // Patient summary for sidebar (filtered month)
  const pacMap={};
  conduces.forEach(r=>{
    if(!pacMap[r.nombre]) pacMap[r.nombre]={nombre:r.nombre,facturado:0,saldo:0,count:0};
    pacMap[r.nombre].facturado+=r.facturacion||0;
    pacMap[r.nombre].saldo+=r.saldo_pendiente||0;
    pacMap[r.nombre].count++;
  });
  const pacList=Object.values(pacMap).sort((a,b)=>b.facturado-a.facturado);
  const maxFact=pacList[0]?.facturado||1;

  </div>
  <div class="metric">
    <div class="metric-label">Pacientes facturados</div>

async function guardarEditConduce(id){
  const fact=parseFloat(document.getElementById('ec-fact').value)||0;
  const saldo=parseFloat(document.getElementById('ec-saldo').value)||0;
  const motivo=document.getElementById('ec-motivo').value;
  if(saldo>fact){alert('El saldo pendiente no puede ser mayor al monto del conduce.');return;}
  try{
    const updated=await api.put('/registros/'+id,{facturacion:fact,saldo_pendiente:saldo,motivo});
    const idx=DB.registros.findIndex(r=>r.id===id);
    if(idx>-1) DB.registros[idx]=updated;
    showToast('Conduce actualizado');
    closeModal();
    renderFacturacion();
  }catch(e){showToast('Error: '+e.message,true);}
}

let _miniMap=null, _miniMarker=null;
function initMiniMapa(){
  const el=document.getElementById('col-mini-map');
  if(!el) return;
  if(_miniMap){ _miniMap.remove(); _miniMap=null; _miniMarker=null; }
  _miniMap=L.map('col-mini-map',{zoomControl:true}).setView([18.4861,-69.9312],11);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
    attribution:'© OpenStreetMap',maxZoom:19,
  }).addTo(_miniMap);
  _miniMap.on('click',e=>{
    const {lat,lng}=e.latlng;
    fijarPinMini(lat,lng);
  });
  // If lat/lng already set (editing), show it
  const lat=parseFloat(document.getElementById('col-lat')?.value);
  const lng=parseFloat(document.getElementById('col-lng')?.value);
  if(lat&&lng) fijarPinMini(lat,lng);
}

function fijarPinMini(lat,lng){
  document.getElementById('col-lat').value=lat.toFixed(6);
  document.getElementById('col-lng').value=lng.toFixed(6);
  if(_miniMarker) _miniMarker.setLatLng([lat,lng]);
  else{
    _miniMarker=L.marker([lat,lng],{draggable:true}).addTo(_miniMap);
    _miniMarker.on('dragend',e=>{
      const p=e.target.getLatLng();
      document.getElementById('col-lat').value=p.lat.toFixed(6);
      document.getElementById('col-lng').value=p.lng.toFixed(6);
    });
  }
  _miniMap.setView([lat,lng],15);
}

function capturarGPS(){
  if(!navigator.geolocation){showToast('GPS no disponible en este navegador',true);return;}
  navigator.geolocation.getCurrentPosition(
    pos=>fijarPinMini(pos.coords.latitude,pos.coords.longitude),
    err=>showToast('Error GPS: '+err.message,true),
    {enableHighAccuracy:true,timeout:8000}
  );
}

async function guardarColocacion(){
  const pac=document.getElementById('col-pac').value;

  if(!pac||pac==='__nuevo__'||!fecha){alert('Selecciona un paciente y una fecha.');return;}

  const nuevo={
    fecha,nombre:pac,
    cedula:'',sexo:'',edad:null,
    lesion:document.getElementById('col-lesion').value,
    direccion:document.getElementById('col-dir').value,
    tel1:document.getElementById('col-tel').value,tel2:'',
    dr_refiere:document.getElementById('col-dr').value,
    ars:document.getElementById('col-ars').value,
    maquina:maqId,estatus:'Activo',
    motivo:document.getElementById('col-num').value,
    facturacion:parseFloat(document.getElementById('col-fact').value)||0,
    modo_uso:document.getElementById('col-modo').value,

    lng:parseFloat(document.getElementById('col-lng').value)||null,
    productos:getProductosFromList('col-productos-list'),
    fotos:getFotosFromPreview('col-foto-preview'),
    fecha_retiro:null,condicion_retorno:'',observaciones_retiro:'',
  };
  try{
    const creado=await api.post('/registros',nuevo);
    DB.registros.push(creado);
    if(maqId){const m=DB.maquinas.find(x=>x.id===maqId);if(m)m.paciente_actual=pac;}
    showToast('Colocación guardada');
  }catch(e){showToast('Error al guardar: '+e.message,true);return;}
  closeModal();
  ({dashboard:renderDash,pacientes:renderPacientes,colocaciones:renderColocaciones,registro:renderRegistro,maquinas:renderMaquinas})[VIEW]?.();
}

function switchTab(el,tabId){
  const modal=el.closest('.modal');
  modal.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  const prefix=tabId.split('-')[0]+'-';
  modal.querySelectorAll(`[id^="${prefix}"]`).forEach(d=>d.style.display='none');
  const t=document.getElementById(tabId);if(t)t.style.display='';
}

async function guardarAsignarEquipo(nombre){
  const maqId=document.getElementById('aeq-maqid').value;
  const fecha=document.getElementById('aeq-fecha').value;
  if(!fecha){alert('La fecha es obligatoria.');return;}
  const p=getPacientesUnicos().find(x=>x.nombre===nombre)||{};
  const nuevo={
    fecha,nombre,
    cedula:p.cedula||'',sexo:p.sexo||'',edad:p.edad||null,
    lesion:document.getElementById('aeq-lesion').value||p.lesion||'',
    direccion:p.direccion||'',tel1:p.tel1||'',tel2:p.tel2||'',
    dr_refiere:p.dr_refiere||'',ars:p.ars||'Privado',
    maquina:maqId,estatus:'Activo',
    motivo:document.getElementById('aeq-num').value,
    facturacion:parseFloat(document.getElementById('aeq-fact').value)||0,
    modo_uso:document.getElementById('aeq-modo').value,
    condicion_salida:document.getElementById('aeq-cond').value,
    parametros:document.getElementById('aeq-parametros').value,
    notas:document.getElementById('aeq-notas').value,
    proxima_colocacion:document.getElementById('aeq-proxima').value||null,
    notas_seguimiento:'',
    productos:getProductosFromList('aeq-productos-list'),
    fotos:getFotosFromPreview('aeq-foto-preview'),
    fecha_retiro:null,condicion_retorno:'',observaciones_retiro:'',
  };
  try{
    // The server deactivates previous active records for this patient
    const creado=await api.post('/registros',nuevo);
    // Deactivate locally too
    DB.registros.filter(r=>r.nombre===nombre&&r.estatus==='Activo').forEach(r=>{
      if(r.maquina){const m=DB.maquinas.find(x=>x.id===r.maquina);if(m)m.paciente_actual=null;}
      r.estatus='Desactivado';
    });
    DB.registros.push(creado);
    if(maqId){const m=DB.maquinas.find(x=>x.id===maqId);if(m)m.paciente_actual=nombre;}
    showToast('Equipo asignado');
  }catch(e){showToast('Error: '+e.message,true);return;}
  closeModal();
  ({dashboard:renderDash,pacientes:renderPacientes,colocaciones:renderColocaciones,registro:renderRegistro,maquinas:renderMaquinas})[VIEW]?.();
}

let _importData=[];
function parsearExcel(file){
  if(!file)return;
  const reader=new FileReader();
  reader.onload=e=>{
    const wb=XLSX.read(e.target.result,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    if(rows.length<2){
      document.getElementById('imp-preview').innerHTML=`<div class="empty-state"><i class="ti ti-alert-circle"></i>El archivo no tiene datos.</div>`;
      return;
    }
    const headers=rows[0].map(h=>String(h).trim());
    _importData=rows.slice(1).filter(r=>r.some(c=>c!=='')).map(r=>{
      const o={};
      headers.forEach((h,i)=>o[h]=r[i]!==undefined?String(r[i]).trim():'');
      return o;
    });
    const COLS=['Nombre','Cédula','Sexo','Edad','Área de lesión','Fecha','ID Máquina','N° Colocación','Monto (DOP)'];
    const ok=_importData.filter(r=>r['Nombre']&&r['Fecha']).length;
    const skip=_importData.length-ok;
    document.getElementById('imp-preview').innerHTML=`
    <div style="padding:10px 12px;background:var(--ok-bg);border-radius:var(--r);font-size:13px;color:var(--ok-t);margin-bottom:10px">
      <i class="ti ti-check"></i> <strong>${ok} filas listas</strong> para importar${skip>0?` · <span style="color:var(--warn-t)">${skip} sin nombre o fecha (se omitirán)</span>`:''}
    </div>
    <div class="tbl-wrap" style="max-height:220px;overflow-y:auto">
      <table class="tbl">
        <thead><tr>${COLS.map(c=>`<th>${c}</th>`).join('')}</tr></thead>
        <tbody>
          ${_importData.slice(0,10).map(r=>`<tr style="${(!r['Nombre']||!r['Fecha'])?'opacity:0.4':''}">
            ${COLS.map(c=>`<td style="font-size:11px">${r[c]||'—'}</td>`).join('')}
          </tr>`).join('')}
          ${_importData.length>10?`<tr><td colspan="${COLS.length}" style="text-align:center;color:var(--text3);font-size:11px">... y ${_importData.length-10} filas más</td></tr>`:''}
        </tbody>
      </table>
    </div>
    <div style="display:flex;gap:8px;margin-top:12px">
      <button class="btn btn-primary" style="flex:1" onclick="confirmarImportacion()"><i class="ti ti-table-import"></i>Importar ${ok} registros</button>
      <button class="btn" onclick="closeModal()">Cancelar</button>
    </div>`;
  };
  reader.readAsArrayBuffer(file);
}

async function confirmarImportacion(){
  const validRows=_importData.filter(r=>r['Nombre']&&r['Fecha']);
  const registros=validRows.map(r=>{
    const maqId=r['ID Máquina']||'';
    const maqExiste=maqId&&DB.maquinas.find(x=>x.id===maqId);
    return {
      fecha:r['Fecha'],nombre:r['Nombre'],
      cedula:r['Cédula']||'',sexo:r['Sexo']||'',edad:parseInt(r['Edad'])||null,
      lesion:r['Área de lesión']||'',direccion:r['Dirección']||'',
      tel1:r['Teléfono 1']||'',tel2:r['Teléfono 2']||'',
      dr_refiere:r['Dr. que refiere']||'',ars:r['ARS']||'Privado',
      maquina:maqExiste?maqId:'',estatus:'Activo',
      motivo:r['N° Colocación']||'',
      facturacion:parseFloat(r['Monto (DOP)'])||0,
    };
  });
  try{
    const creados=await api.post('/registros/bulk',registros);
    await initDB();
    closeModal();
    showToast(`${creados.length} registros importados`);
  }catch(e){showToast('Error al importar: '+e.message,true);}
  ({dashboard:renderDash,pacientes:renderPacientes,colocaciones:renderColocaciones,registro:renderRegistro,maquinas:renderMaquinas})[VIEW]?.();
}

async function eliminarPaciente(nombre){
  try{
    await api.del('/pacientes/'+encodeURIComponent(nombre));
    DB.registros.filter(r=>r.nombre===nombre&&r.estatus==='Activo'&&r.maquina).forEach(r=>{
      const m=DB.maquinas.find(x=>x.id===r.maquina);
      if(m)m.paciente_actual=null;
    });
    DB.registros=DB.registros.filter(r=>r.nombre!==nombre);
    delete DB.pacientes_master[nombre];
    showToast('Paciente eliminado');
  }catch(e){showToast('Error: '+e.message,true);return;}
  closeModal();
  ({dashboard:renderDash,pacientes:renderPacientes,colocaciones:renderColocaciones,registro:renderRegistro,maquinas:renderMaquinas})[VIEW]?.();
}

async function eliminarMaquina(id){
  try{
    await api.del('/maquinas/'+id);
    DB.registros.filter(r=>r.maquina===id&&r.estatus==='Activo').forEach(r=>r.estatus='Desactivado');

    DB.maquinas=DB.maquinas.filter(x=>x.id!==id);
    showToast('Máquina eliminada');
  }catch(e){showToast('Error: '+e.message,true);return;}
  closeModal();
  ({dashboard:renderDash,pacientes:renderPacientes,colocaciones:renderColocaciones,registro:renderRegistro,maquinas:renderMaquinas})[VIEW]?.();
}

function addProductoRow(containerId, prod={desc:'',qty:1,precio:0}){
  const container=document.getElementById(containerId);if(!container)return;
  const div=document.createElement('div');
  div.className='prod-row';
  div.innerHTML=`
    <input type="text" placeholder="Descripción del producto" value="${prod.desc}" oninput="updateProdTotal('${containerId}')">
    <input type="number" placeholder="Cant." value="${prod.qty}" min="1" oninput="updateProdTotal('${containerId}')">
    <input type="number" placeholder="Precio unit." value="${prod.precio}" min="0" oninput="updateProdTotal('${containerId}')">
    <button type="button" class="btn btn-sm btn-danger" style="padding:4px 7px" onclick="this.parentElement.remove();updateProdTotal('${containerId}')"><i class="ti ti-x"></i></button>`;
  container.appendChild(div);
  updateProdTotal(containerId);
}
function updateProdTotal(containerId){
  const container=document.getElementById(containerId);if(!container)return;
  const totalId=containerId.replace('-list','-total').replace('productos','prod');
  const totalEl=document.getElementById(totalId);
  let total=0;
  container.querySelectorAll('.prod-row').forEach(row=>{
    const inputs=row.querySelectorAll('input');
    const qty=parseFloat(inputs[1].value)||0;
    const precio=parseFloat(inputs[2].value)||0;
    total+=qty*precio;
  });
  if(totalEl) totalEl.textContent=total>0?`Subtotal productos: ${fmt(total)}`:'';
}
function getProductosFromList(containerId){
  const container=document.getElementById(containerId);if(!container)return[];
  const prods=[];
  container.querySelectorAll('.prod-row').forEach(row=>{
    const inputs=row.querySelectorAll('input');
    const desc=inputs[0].value.trim();
    const qty=parseFloat(inputs[1].value)||1;
    const precio=parseFloat(inputs[2].value)||0;
    if(desc) prods.push({desc,qty,precio});
  });
  return prods;
}
function renderProductosEnHistorial(productos){
  if(!productos||!productos.length) return '';
  const total=productos.reduce((s,p)=>s+(p.qty*p.precio),0);
  return`<div style="margin-top:6px;padding:8px 10px;background:var(--bg2);border-radius:var(--r);font-size:12px">
    <div style="font-weight:700;color:var(--text2);margin-bottom:4px">Productos utilizados:</div>
    ${productos.map(p=>`<div style="display:flex;justify-content:space-between;padding:2px 0"><span>${p.desc} × ${p.qty}</span><span style="font-weight:600">${fmt(p.qty*p.precio)}</span></div>`).join('')}
    ${total>0?`<div style="border-top:0.5px solid var(--border);margin-top:4px;padding-top:4px;font-weight:700;display:flex;justify-content:space-between"><span>Subtotal productos</span><span>${fmt(total)}</span></div>`:''}
  </div>`;
}

function agregarFotosSection(modalPrefix){

function addFotoPreview(input, previewId){
  const preview=document.getElementById(previewId);if(!preview)return;
  const files=Array.from(input.files);
  files.forEach(file=>{
    if(!file.type.startsWith('image/'))return;
    const reader=new FileReader();
    reader.onload=e=>{
      const img=document.createElement('img');
      img.src=e.target.result;
      img.className='foto-thumb';
      img.dataset.b64=e.target.result;
      img.onclick=()=>abrirLightbox(e.target.result);
      preview.appendChild(img);
    };
    reader.readAsDataURL(file);
  });
}
function getFotosFromPreview(previewId){
  const preview=document.getElementById(previewId);if(!preview)return[];
  return Array.from(preview.querySelectorAll('img')).map(img=>img.dataset.b64).filter(Boolean);
}
function abrirLightbox(src){
  const lb=document.createElement('div');
  lb.className='lightbox';
  lb.innerHTML=`<img src="${src}" alt="Foto ampliada">`;
  lb.onclick=()=>lb.remove();
  document.body.appendChild(lb);
}
function renderGaleriaFotos(fotos){
  if(!fotos||!fotos.length) return '';
  return`<div style="margin-top:6px">
    <div style="font-size:11px;font-weight:700;color:var(--text2);margin-bottom:4px">Fotos:</div>
    <div class="foto-thumbs">${fotos.map(f=>`<img src="${f}" class="foto-thumb" onclick="abrirLightbox('${f.replace(/'/g,"\\'")}')"/>`).join('')}</div>
  </div>`;
}

// ELIMINAR COLOCACIÓN
// ══════════════════════════════════════════════════════════════════════════════
function eliminarColocacion(registroId){
  const reg=DB.registros.find(r=>r.id===registroId);
  if(!reg){alert('Registro no encontrado.');return;}
  const maqLabel=reg.maquina?getMaquinaLabel(reg.maquina):'';
  document.getElementById('modal-root').innerHTML=`
<div class="overlay" onclick="if(event.target===this)closeModal()">
<div class="modal" style="max-width:460px">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <div style="text-align:center;padding:8px 0 16px">
    <div style="width:52px;height:52px;border-radius:50%;background:var(--danger-bg);display:flex;align-items:center;justify-content:center;margin:0 auto 14px">
      <i class="ti ti-trash" style="font-size:24px;color:var(--danger-t)"></i>
    </div>
    <div style="font-size:17px;font-weight:700;margin-bottom:6px">Eliminar colocación</div>
    <div style="font-size:13px;color:var(--text2);margin-bottom:6px">${reg.nombre}</div>
    <div style="font-size:12px;font-family:monospace;color:var(--text3);margin-bottom:12px">${reg.id} · ${fmtD(reg.fecha)}${maqLabel?' · '+maqLabel:''}</div>
    ${reg.estatus==='Activo'?`<div style="font-size:12px;padding:8px 12px;background:var(--warn-bg);color:var(--warn-t);border-radius:var(--r);margin-bottom:12px"><i class="ti ti-alert-triangle"></i> Colocación activa — el equipo quedará libre al eliminar.</div>`:''}
    <div style="font-size:12px;color:var(--text3);margin-bottom:20px">¿Eliminar esta colocación? Esta acción no se puede deshacer.</div>
    <div style="display:flex;gap:8px;justify-content:center">
      <button class="btn btn-danger" onclick="confirmarEliminarColocacion('${registroId}')"><i class="ti ti-trash"></i>Sí, eliminar</button>
      <button class="btn" onclick="closeModal()">Cancelar</button>
    </div>
  </div>
</div>
</div>`;
}

async function confirmarEliminarColocacion(registroId){
  const reg=DB.registros.find(r=>r.id===registroId);
  if(!reg)return;
  try{
    await api.del('/registros/'+registroId);
    if(reg.estatus==='Activo'&&reg.maquina){
      const m=DB.maquinas.find(x=>x.id===reg.maquina);
      if(m)m.paciente_actual=null;
    }
    DB.registros=DB.registros.filter(r=>r.id!==registroId);
    showToast('Colocación eliminada');
  }catch(e){showToast('Error: '+e.message,true);return;}
  closeModal();
  ({dashboard:renderDash,pacientes:renderPacientes,colocaciones:renderColocaciones,registro:renderRegistro,maquinas:renderMaquinas})[VIEW]?.();
}

// SISTEMA DE LOGIN
// ══════════════════════════════════════════════════════════════════════════════
function checkSession(){
  const sess=sessionStorage.getItem('meditrack_session');
  if(sess){
    try{
      const s=JSON.parse(sess);
      document.querySelector('.app').style.display='flex';
      mostrarTopbarUsuario(s.nombre, s.rol);
      return true;
    }catch(e){}
  }
  document.getElementById('login-screen').style.display='flex';
  return false;
}

async function login(){
  const user=document.getElementById('login-user').value.trim();
  const pass=document.getElementById('login-pass').value;
  try{
    const found=await api.post('/auth/login',{user,pass});
    if(!found.ok){document.getElementById('login-error').style.display='';return;}
    sessionStorage.setItem('meditrack_session',JSON.stringify({user:found.user,nombre:found.nombre,rol:found.rol}));
    document.getElementById('login-screen').style.display='none';
    document.querySelector('.app').style.display='flex';
    mostrarTopbarUsuario(found.nombre,found.rol);
    go('dashboard');
  }catch(e){document.getElementById('login-error').style.display='';}
}

async function logout(){
  if(!confirm('¿Cerrar sesión?')) return;
  try{ await fetch('/api/auth/logout',{method:'POST',credentials:'same-origin'}); }catch(e){}
  sessionStorage.removeItem('meditrack_session');
  document.getElementById('login-screen').style.display='flex';
  document.querySelector('.app').style.display='none';
  document.getElementById('login-user').value='';
  document.getElementById('login-pass').value='';
}

function getSesion(){
  try{ return JSON.parse(sessionStorage.getItem('meditrack_session')||'{}'); }catch(e){ return {}; }
}

function mostrarTopbarUsuario(nombre, rol){
  let el=document.getElementById('topbar-user');
  if(!el){
    el=document.createElement('div');
    el.id='topbar-user';
    el.style.cssText='display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)';
    document.querySelector('.topbar').appendChild(el);
  }
  const adminBadge=rol==='admin'?`<span class="badge badge-brand" style="font-size:10px">Admin</span>`:'';
  el.innerHTML=`${adminBadge}<span style="font-weight:600;color:var(--text)">${nombre}</span><button class="btn btn-sm btn-ghost" onclick="logout()" title="Cerrar sesión"><i class="ti ti-logout" style="font-size:14px"></i></button>`;
  // Mostrar sección Usuarios solo a admins
  document.querySelectorAll('.admin-only').forEach(e=>e.style.display=rol==='admin'?'':'none');
}

function nextUID(){
  const nums=DB.usuarios.map(u=>parseInt(u.id.replace('U',''))||0);
  return 'U'+String(Math.max(0,...nums)+1).padStart(3,'0');
}

function renderUsuarios(){
  const sesion=getSesion();
  if(sesion.rol!=='admin'){
    document.getElementById('content').innerHTML=`<div class="empty-state"><i class="ti ti-lock"></i><p>Solo los administradores pueden gestionar usuarios.</p></div>`;
    return;
  }
  document.getElementById('content').innerHTML=`
<div class="card" style="margin-bottom:0">
  <div class="card-title"><i class="ti ti-users-group" style="font-size:13px;vertical-align:-1px;margin-right:5px"></i>Usuarios del sistema</div>
  <div class="tbl-wrap">
    <table class="tbl">
      <thead><tr>
        <th>Usuario</th><th>Nombre</th><th>Rol</th><th>Estado</th><th style="width:120px">Acciones</th>
      </tr></thead>
      <tbody>
        ${DB.usuarios.map(u=>`
        <tr>
          <td><code style="background:var(--bg2);padding:2px 6px;border-radius:4px;font-size:12px">${u.user}</code></td>
          <td style="font-weight:500">${u.nombre}</td>
          <td>${u.rol==='admin'?`<span class="badge badge-brand">Admin</span>`:`<span class="badge badge-info">Usuario</span>`}</td>
          <td>${u.activo!==false?`<span class="badge badge-ok">Activo</span>`:`<span class="badge badge-gray">Inactivo</span>`}</td>
          <td>
            <div style="display:flex;gap:4px">
              <button class="btn btn-sm btn-ghost" onclick="editarUsuario('${u.id}')" title="Editar"><i class="ti ti-pencil"></i></button>
              ${u.id==='U001'?`<button class="btn btn-sm btn-ghost" style="opacity:.3;cursor:not-allowed" title="No se puede eliminar el admin principal"><i class="ti ti-trash"></i></button>`:`<button class="btn btn-sm btn-ghost" style="color:var(--danger-t)" onclick="eliminarUsuario('${u.id}')" title="Eliminar"><i class="ti ti-trash"></i></button>`}
            </div>
          </td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>
</div>`;
}

function abrirNuevoUsuario(){
  document.getElementById('modal-root').innerHTML=`
<div class="overlay" onclick="if(event.target===this)closeModal()">
<div class="modal" style="max-width:480px">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <div class="modal-title"><i class="ti ti-user-plus" style="margin-right:8px;color:var(--brand)"></i>Nuevo Usuario</div>
  <div class="form-grid">
    <div class="form-group">
      <label>Nombre completo</label>
      <input type="text" id="nu-nombre" placeholder="Ej. Dr. García">

      <input type="text" id="nu-user" placeholder="Ej. dgarcia" autocomplete="off">
    </div>

      <label>Contraseña</label>

async function guardarNuevoUsuario(){
  const nombre=document.getElementById('nu-nombre').value.trim();
  const user=document.getElementById('nu-user').value.trim().toLowerCase();
  const pass=document.getElementById('nu-pass').value;
  const rol=document.getElementById('nu-rol').value;
  const errEl=document.getElementById('nu-error');
  if(!nombre||!user||!pass){ errEl.textContent='Completa todos los campos.'; errEl.style.display=''; return; }
  if(pass.length<4){ errEl.textContent='La contraseña debe tener al menos 4 caracteres.'; errEl.style.display=''; return; }
  try{
    const creado=await api.post('/usuarios',{user,pass,nombre,rol,activo:true});
    DB.usuarios.push(creado);
    showToast('Usuario creado');
    closeModal();renderUsuarios();
  }catch(e){errEl.textContent='Error: '+(e.message||'No se pudo crear el usuario.');errEl.style.display='';}
}

function editarUsuario(uid){
  const u=DB.usuarios.find(x=>x.id===uid);
  if(!u) return;
  document.getElementById('modal-root').innerHTML=`
<div class="overlay" onclick="if(event.target===this)closeModal()">
<div class="modal" style="max-width:480px">
  <button class="modal-close" onclick="closeModal()">✕</button>
  <div class="modal-title"><i class="ti ti-user-edit" style="margin-right:8px;color:var(--brand)"></i>Editar Usuario</div>
  <div class="form-grid">
    <div class="form-group">
      <label>Nombre completo</label>
      <input type="text" id="eu-nombre" value="${u.nombre}">
    </div>
    <div class="form-group">
      <label>Usuario (login)</label>
      <input type="text" id="eu-user" value="${u.user}" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Nueva contraseña <span style="font-weight:400;color:var(--text3)">(dejar vacío para no cambiar)</span></label>
      <input type="password" id="eu-pass" placeholder="••••••••" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label>Rol</label>
      <select id="eu-rol" ${u.id==='U001'?'disabled':''}>
        <option value="usuario" ${u.rol==='usuario'?'selected':''}>Usuario</option>

      </select>
    </div>
    <div class="form-group span2">
      <label>Estado</label>
      <select id="eu-activo" ${u.id==='U001'?'disabled':''}>
        <option value="1" ${u.activo!==false?'selected':''}>Activo</option>
        <option value="0" ${u.activo===false?'selected':''}>Inactivo</option>
      </select>
    </div>
  </div>
  <div id="eu-error" style="font-size:12px;color:var(--danger-t);margin-bottom:10px;display:none"></div>
  <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
    <button class="btn" onclick="closeModal()">Cancelar</button>

  </div>

}

async function guardarEditUsuario(uid){
  const u=DB.usuarios.find(x=>x.id===uid);
  if(!u) return;
  const nombre=document.getElementById('eu-nombre').value.trim();
  const user=document.getElementById('eu-user').value.trim().toLowerCase();
  const pass=document.getElementById('eu-pass').value;
  const rol=document.getElementById('eu-rol').value||u.rol;
  const activo=document.getElementById('eu-activo').value!=='0';
  const errEl=document.getElementById('eu-error');
  if(!nombre||!user){ errEl.textContent='Nombre y usuario son obligatorios.'; errEl.style.display=''; return; }
  if(pass&&pass.length<4){ errEl.textContent='La contraseña debe tener al menos 4 caracteres.'; errEl.style.display=''; return; }
  try{
    const upd={nombre,user,rol,activo};
    if(pass) upd.pass=pass;
    const updated=await api.put('/usuarios/'+uid,upd);
    Object.assign(u,updated);
    showToast('Usuario actualizado');
    closeModal();renderUsuarios();
  }catch(e){errEl.textContent='Error: '+(e.message||'No se pudo actualizar.');errEl.style.display='';}
}

  const u=DB.usuarios.find(x=>x.id===uid);
  if(!u) return;
  document.getElementById('modal-root').innerHTML=`

    </div>
  </div>
</div>

async function confirmarEliminarUsuario(uid){
  try{
    await api.del('/usuarios/'+uid);

    showToast('Usuario eliminado');
  }catch(e){showToast('Error: '+e.message,true);return;}
